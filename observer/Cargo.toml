[package]
name = "iron-vault-observer"
version = "0.1.0"
description = "Read-only event observer for the IronVault Solana program"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/BlockForge-Dev/iron-vault"
rust-version = "1.89"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.4"
base64 = "=0.22.1"
borsh = { version = "=1.5.7", features = ["derive"] }
bs58 = "=0.5.1"
clap = { version = "=4.5.48", features = ["derive", "env"] }
futures-util = "=0.3.31"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "json"] }
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
